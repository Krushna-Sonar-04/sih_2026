services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti
      POSTGRES_DB: drishti
    ports:
      - "5432:5432"
    volumes:
      - drishti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://drishti:drishti@db:5432/drishti
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  drishti_pgdata:
